name: Analyze Prediction Errors

on:
  schedule:
    # Run every Monday at 07:00 UTC (after weekend accuracy batch + weekly report)
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write    # needed to open GitHub Issues

jobs:
  analyze-misses:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run miss analysis
        run: python scripts/analyze-prediction-errors.py

      - name: Commit analysis report
        run: |
          git config user.name  "Nostradamus Bot"
          git config user.email "bot@nostradamus.app"

          git add data/accuracy/miss-analysis-*.json || true

          if git diff --cached --quiet; then
            echo "No new analysis to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "🔍 Miss analysis [${TODAY}]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Open GitHub Issue with findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the most recent miss-analysis JSON
          ANALYSIS_FILE=$(ls data/accuracy/miss-analysis-*.json 2>/dev/null | sort | tail -1)

          if [ -z "$ANALYSIS_FILE" ]; then
            echo "No analysis file found — skipping issue creation."
            exit 0
          fi

          # Extract key findings from the JSON
          ISSUE_BODY=$(python3 - <<'PYEOF'
          import json, sys
          from pathlib import Path
          import glob

          files = sorted(glob.glob("data/accuracy/miss-analysis-*.json"))
          if not files:
              print("No analysis available.")
              sys.exit(0)

          with open(files[-1]) as f:
              d = json.load(f)

          date_str = d.get("analysisDate", "unknown")
          overall  = d.get("overallHitRate", 0)
          total    = d.get("totalPredictions", 0)
          correct  = d.get("totalCorrect", 0)
          window   = d.get("windowDays", 7)
          patterns = d.get("topMissPatterns", [])
          ev_data  = d.get("evTopN", {})
          sector_misses = d.get("sectorMisses", {})

          lines = [
              f"## 🔮 Weekly Prediction Miss Analysis — {date_str}",
              "",
              f"**Analysis window:** {window} days",
              f"**Overall hit rate:** {overall:.1%} ({correct}/{total} correct)",
              "",
          ]

          if ev_data.get("hitRate") is not None:
              lines += [
                  f"### 🎯 Top-{ev_data['n']} EV Subset",
                  f"Hit rate: **{ev_data['hitRate']:.1%}** ({ev_data['correct']}/{ev_data['total']})",
                  "",
              ]

          underperforming = {
              k: v for k, v in sector_misses.items()
              if v.get("flag") == "UNDERPERFORMING"
          }
          if underperforming:
              lines.append("### ⚠️ Underperforming Sectors")
              for sec, data in underperforming.items():
                  lines.append(f"- **{sec}**: {data['hitRate']:.1%} hit rate (n={data['total']})")
              lines.append("")

          lines.append("### 📋 Key Findings")
          for pattern in patterns:
              lines.append(f"- {pattern}")
          lines.append("")
          lines.append("*Auto-generated by `analyze-misses.yml` workflow.*")

          print("\n".join(lines))
          PYEOF
          )

          TODAY=$(date -u +%Y-%m-%d)
          ISSUE_TITLE="🔮 Weekly miss analysis — ${TODAY}"

          gh issue create \
            --title "${ISSUE_TITLE}" \
            --body "${ISSUE_BODY}" \
            --label "model-analysis" || echo "Issue creation failed (label may not exist) — continuing."
