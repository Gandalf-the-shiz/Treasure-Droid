name: verify-data-feeds

# Daily probe of every upstream data provider used by the prediction model
# and the paper-investing agent. Writes data/feeds/health.json and rolls a
# 90-day history so we can see provider drift over time.

on:
  schedule:
    # Every day at 09:15 UTC (~04:15 ET), before the US session opens.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Probe live data feeds
        env:
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GDELT_QUERY: "stock market"
        run: |
          python scripts/verify-data-feeds.py

      - name: Commit health snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds/health.json data/feeds/health-history.json || true
          if git diff --cached --quiet; then
            echo "No feed health changes to commit"
          else
            git commit -m "chore(data-feeds): refresh health snapshot"
            git push
          fi
